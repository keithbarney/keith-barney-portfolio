<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio for Keith Barney, Design Systems Lead.">
  <title>Keith Barney — Portfolio</title>
  <style>
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2"),
        url("src/assets/fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 400;
    }

    :root {
      --resume-paper: #ffffff;
      --resume-ink: #111111;
      --resume-muted: #707070;
      --resume-rule: #d8d8d8;
      --resume-selection: #111111;
      --resume-selection-text: #fafafa;
      --resume-font-size: 10px;
      --resume-line-height: 1.5;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--resume-ink);
      background: var(--resume-paper);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: var(--resume-font-size);
      font-weight: 400;
      line-height: var(--resume-line-height);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      color: var(--resume-selection-text);
      background: var(--resume-selection);
    }

    a {
      color: inherit;
      text-decoration: none;
      text-underline-offset: 0.18em;
    }

    a:visited { color: inherit; }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
      text-decoration-color: currentColor;
    }

    a:focus-visible {
      outline: 2px solid var(--resume-ink);
      outline-offset: 4px;
    }

    .skip-link {
      position: absolute;
      top: 0;
      left: 1rem;
      z-index: 2;
      padding: 0.55rem 0.75rem;
      color: var(--resume-paper);
      background: var(--resume-ink);
      transform: translateY(-120%);
    }

    .skip-link:focus { transform: translateY(0); }

    .resume {
      --resume-row-padding: var(--site-section-gap);
      width: min(100%, 1440px);
      margin-inline: auto;
      padding: var(--site-page-top) var(--site-page-gutter) var(--site-page-bottom);
    }

    .masthead,
    .experience {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: var(--site-column-gap);
    }

    .masthead {
      align-items: start;
      padding-bottom: 0;
    }

    .role-title {
      margin: 0;
      font-size: 1em;
      font-weight: 400;
      line-height: 1.5;
    }

    .role-company,
    .role-years,
    .skills,
    .impact { color: var(--resume-muted); }

    .role-company,
    .role-years,
    .skills,
    .impact { margin: 0; }

    .skills,
    .impact {
      list-style: none;
      padding: 0;
    }

    .experience {
      row-gap: 0;
    }

    .experience-list {
      display: grid;
      grid-column: 2 / -1;
      grid-template-columns: subgrid;
      min-width: 0;
    }

    .current-experience,
    .experience-list > article {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: subgrid;
      min-width: 0;
      padding-bottom: var(--resume-row-padding);
      transition: background-color 160ms ease;
    }

    .current-experience { grid-column: 2 / -1; }

    .current-experience:hover,
    .experience-list > article:hover {
      background-color: #f6f6f6;
    }

    .role { min-width: 0; }

    .role-title { color: var(--resume-ink); }

    .role-title strong { font-weight: 400; }

    @media (max-width: 760px) {
      body {
        --resume-font-size: 12px;
      }

      .resume {
        display: flex;
        flex-direction: column;
        padding-bottom: var(--site-space-3);
      }

      .masthead,
      .experience {
        display: contents;
      }

      .current-experience,
      .experience-list,
      .experience-list > article {
        display: block;
      }

      .current-experience { order: 1; }

      .experience-list { order: 2; }

      .current-experience,
      .experience-list > article {
        margin-top: 0;
        padding-block: 0 var(--resume-row-padding);
      }

      .current-experience > * + *,
      .experience-list > article > * + * { margin-top: 0; }

      .current-experience .role-company,
      .current-experience .role-years,
      .experience-list > article .role-company,
      .experience-list > article .role-years { margin-top: 0; }

      .skills,
      .impact {
        display: block;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }

      .current-experience,
      .experience-list > article { transition: none; }
    }

    @media print {
      @page { margin: 0.5in; }

      body { font-size: 10px; }

      .resume { width: 100%; padding: 0; }

      .masthead { padding-bottom: 0; }

      .experience { row-gap: 0; }

      .current-experience,
      .experience-list > article { break-inside: avoid; }

      .skip-link { display: none; }
    }
  </style>
